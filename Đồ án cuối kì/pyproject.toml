[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beijing-air-quality"
version = "0.1.0"
description = "Beijing air quality forecasting project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn>=1.2",
    "matplotlib",
    "seaborn",
    "joblib",
    "threadpoolctl",
    "streamlit",
    "pytest",
    "jupyter",
]

[project.optional-dependencies]
midterm = ["python-docx>=1.2,<2", "python-pptx>=1,<2", "PyMuPDF>=1.26,<3", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
